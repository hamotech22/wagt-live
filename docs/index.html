<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wagt-live/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wagt</title>

    <!-- مضاف: بيطبّق الدارك قبل ما الصفحة تترسم (يمنع الوميض الأبيض) -->
    <script>
      try {
        var t = localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        // مضاف: شرط إن المسار يكون داشبورد (الصفحة الرئيسية ما تتأثرش)
        if (t === 'dark' && location.pathname.startsWith('/dashboard')) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

    <!-- مضاف: خلفية فورية للداشبورد الغامق لحد ما الـ CSS يتحمّل -->
    <style>html.dark,html.dark body{background:#020617}</style>
    <script type="module" crossorigin src="/wagt-live/assets/index-CQAiHx_S.js"></script>
    <link rel="stylesheet" crossorigin href="/wagt-live/assets/index-B9AXAReZ.css">
  </head>
  <body class="bg-slate-100 dark:bg-slate-950">
    <div id="root"></div>
  </body>
</html>
